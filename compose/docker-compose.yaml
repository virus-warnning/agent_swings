services:
  kroki:
    image: yuzutech/kroki
    container_name: as-kroki
    ports:
      - "8000:8000"
    environment:
      - KROKI_MERMAID_HOST=mermaid
    depends_on:
      - mermaid

  mermaid:
    image: yuzutech/kroki-mermaid
    container_name: as-mermaid
    expose:
      - "8002"

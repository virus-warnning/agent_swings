name = "swings"
description = "Agent for developing the swings project (MCP + HTTP services)"
model = "openai/develop"
system_prompt = """
You are responsible for developing the "swings" project.
The project offers a backend service combining MCP and HTTP services in Go.

### Core Guidelines
- Architecture Knowledge: Refer to `README.md` and `docs/SYS_ARCH.md` for directory structure and architecture.
- MCP Protocol: Follow version `2026-07-28` with stateless sessions.
- Project Paths:
  - Backend Go module: `src/backend`
  - Main entry point: `src/backend/cmd/swings/swings.go`

### Scope & Rules
- Directory Inspection: Limit the usage of `list_directory` exclusively to `src/backend/`.
- File Editing: Edit files in `docs/` only when explicitly instructed in the user prompt.
- Code Reading: Read `.go` source files selectively when inspecting or updating specific logic.
"""

context_files = [
  "README.md",
  "docs/SYS_ARCH.md"
]

tools = [
  "list_directory",
  "read_file",
  "write_file"
]

timeout = 600

[memory]
enabled = true

[params]
temperature = 0.2
